<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物业管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; }
    
    /* 顶部导航 */
    .header {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header h1 { font-size: 20px; }
    .header-right { display: flex; gap: 16px; align-items: center; }
    .user-info { font-size: 14px; opacity: 0.9; }
    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    
    /* 主体布局 */
    .main { display: flex; min-height: calc(100vh - 60px); }
    
    /* 侧边栏 */
    .sidebar {
      width: 200px;
      background: white;
      border-right: 1px solid #eee;
      padding: 20px 0;
    }
    .menu-item {
      padding: 12px 24px;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item.active {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    
    /* 内容区 */
    .content { flex: 1; padding: 24px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #333; }
    
    /* 统计卡片 */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-value { font-size: 32px; font-weight: 700; color: #f5576c; margin-bottom: 8px; }
    .stat-label { font-size: 14px; color: #666; }
    
    /* 表格 */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { font-weight: 600; color: #666; font-size: 14px; background: #f9f9f9; }
    td { font-size: 14px; }
    
    /* 按钮 */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245, 87, 108, 0.3); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    
    /* 表单 */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; font-size: 14px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #f5576c;
    }
    .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    
    /* 标签 */
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .tag-success { background: #e8f5e9; color: #2e7d32; }
    .tag-warning { background: #fff3e0; color: #f57c00; }
    
    /* 隐藏/显示 */
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏠 物业管理后台</h1>
    <div class="header-right">
      <span class="user-info" id="userInfo">-</span>
      <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
  </div>
  
  <div class="main">
    <div class="sidebar">
      <div class="menu-item active" onclick="showPage('dashboard')">📊 概览</div>
      <div class="menu-item" onclick="showPage('communities')">🏘️ 小区管理</div>
      <div class="menu-item" onclick="showPage('buildings')">🏢 楼栋管理</div>
      <div class="menu-item" onclick="showPage('deductions')">💰 抵扣审核</div>
    </div>
    
    <div class="content">
      <!-- 概览页 -->
      <div class="page active" id="dashboard">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-value" id="statCommunities">0</div>
            <div class="stat-label">管辖小区</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statBuildings">0</div>
            <div class="stat-label">楼栋总数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statPending">0</div>
            <div class="stat-label">待审核抵扣</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statSettlement">0</div>
            <div class="stat-label">已结算金额</div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">管辖小区</div>
          <table id="communitiesTable">
            <thead>
              <tr>
                <th>小区名称</th>
                <th>地址</th>
                <th>楼栋数</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- 小区管理页 -->
      <div class="page" id="communities">
        <div class="card">
          <div class="card-title">创建小区</div>
          <form id="createCommunityForm">
            <div class="form-group">
              <label>小区名称 *</label>
              <input type="text" name="name" required placeholder="请输入小区名称">
            </div>
            <div class="form-group">
              <label>小区地址</label>
              <input type="text" name="address" placeholder="请输入小区地址">
            </div>
            <button type="submit" class="btn btn-primary">创建小区</button>
          </form>
        </div>
        
        <div class="card">
          <div class="card-title">小区列表</div>
          <table id="communityListTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>小区名称</th>
                <th>地址</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- 楼栋管理页 -->
      <div class="page" id="buildings">
        <div class="card">
          <div class="card-title">
            <select id="buildingCommunitySelect" style="padding:8px 12px;border-radius:6px;border:1px solid #ddd;">
              <option value="">选择小区</option>
            </select>
          </div>
          <form id="createBuildingForm" style="margin-top:16px;">
            <div class="form-row">
              <div class="form-group">
                <label>栋号 *</label>
                <input type="text" name="building_no" required placeholder="如：1 栋">
              </div>
              <div class="form-group">
                <label>单元数</label>
                <input type="number" name="unit_count" placeholder="如：2">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>楼层数</label>
                <input type="number" name="floor_count" placeholder="如：6">
              </div>
              <div class="form-group"></div>
            </div>
            <button type="submit" class="btn btn-primary">创建楼栋</button>
          </form>
        </div>
        
        <div class="card">
          <div class="card-title">楼栋列表</div>
          <table id="buildingListTable">
            <thead>
              <tr>
                <th>栋号</th>
                <th>单元数</th>
                <th>楼层数</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- 抵扣审核页 -->
      <div class="page" id="deductions">
        <div class="card">
          <div class="card-title">待审核抵扣申请</div>
          <table id="pendingDeductionsTable">
            <thead>
              <tr>
                <th>用户</th>
                <th>手机号</th>
                <th>抵扣金额</th>
                <th>使用积分</th>
                <th>申请时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 自动使用当前主机地址，支持局域网访问
    const currentHost = window.location.host || 'localhost:3203';
    const API_BASE = window.location.protocol + '//' + currentHost + '/api';
    
    console.log('管理后台 - 当前主机:', currentHost);
    console.log('管理后台 - API 地址:', API_BASE);
    
    let token = localStorage.getItem('propertyToken');
    let propertyInfo = JSON.parse(localStorage.getItem('propertyInfo') || '{}');
    let communities = [];
    
    // 检查登录
    if (!token) {
      window.location.href = '/';
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('userInfo').textContent = propertyInfo.name || '-';
      loadData();
    });
    
    // 加载数据
    async function loadData() {
      await loadCommunities();
      await loadStats();
      await loadPendingDeductions();
    }
    
    // 加载小区列表
    async function loadCommunities() {
      try {
        const res = await fetch(`${API_BASE}/communities`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();
        communities = result.list || [];
        
        // 更新概览页表格
        const tbody = document.querySelector('#communitiesTable tbody');
        tbody.innerHTML = communities.map(c => `
          <tr>
            <td>${c.name}</td>
            <td>${c.address || '-'}</td>
            <td>${c.building_count || 0}</td>
            <td><span class="tag tag-success">正常</span></td>
          </tr>
        `).join('');
        
        // 更新小区列表表格
        const listTbody = document.querySelector('#communityListTable tbody');
        listTbody.innerHTML = communities.map(c => `
          <tr>
            <td>${c.id}</td>
            <td>${c.name}</td>
            <td>${c.address || '-'}</td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="selectCommunity(${c.id})">管理楼栋</button>
            </td>
          </tr>
        `).join('');
        
        // 更新楼栋页下拉框
        const select = document.getElementById('buildingCommunitySelect');
        select.innerHTML = '<option value="">选择小区</option>' + 
          communities.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        
        // 更新统计
        document.getElementById('statCommunities').textContent = communities.length;
      } catch (err) {
        console.error('Load communities error:', err);
      }
    }
    
    // 加载统计
    async function loadStats() {
      try {
        const [buildingsRes, settlementsRes] = await Promise.all([
          fetch(`${API_BASE}/communities`, { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch(`${API_BASE}/settlement/stats`, { headers: { 'Authorization': `Bearer ${token}` } })
        ]);
        
        const settlements = await settlementsRes.json();
        document.getElementById('statSettlement').textContent = (settlements.stats?.amount || 0).toFixed(2);
      } catch (err) {
        console.error('Load stats error:', err);
      }
    }
    
    // 加载待审核抵扣
    async function loadPendingDeductions() {
      try {
        const res = await fetch(`${API_BASE}/deductions/pending`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();
        const list = result.list || [];
        
        document.getElementById('statPending').textContent = list.length;
        
        const tbody = document.querySelector('#pendingDeductionsTable tbody');
        tbody.innerHTML = list.length === 0 ? 
          '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px;">暂无待审核申请</td></tr>' :
          list.map(d => `
            <tr>
              <td>${d.nickname || '-'}</td>
              <td>${d.phone || '-'}</td>
              <td>¥${d.deduction_amount}</td>
              <td>${d.points_used}</td>
              <td>${new Date(d.apply_at).toLocaleDateString()}</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="auditDeduction(${d.id}, 1)">通过</button>
                <button class="btn btn-sm" style="background:#eee;margin-left:8px;" onclick="auditDeduction(${d.id}, 3)">驳回</button>
              </td>
            </tr>
          `).join('');
      } catch (err) {
        console.error('Load deductions error:', err);
      }
    }
    
    // 切换页面
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
      document.getElementById(page).classList.add('active');
      event.target.classList.add('active');
      
      if (page === 'buildings') {
        loadBuildings();
      }
    }
    
    // 选择小区
    function selectCommunity(communityId) {
      document.getElementById('buildingCommunitySelect').value = communityId;
      showPage('buildings');
      loadBuildings();
    }
    
    // 加载楼栋列表
    async function loadBuildings() {
      const communityId = document.getElementById('buildingCommunitySelect').value;
      if (!communityId) {
        document.querySelector('#buildingListTable tbody').innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;padding:40px;">请先选择小区</td></tr>';
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/communities/${communityId}/buildings`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();
        const list = result.list || [];
        
        const tbody = document.querySelector('#buildingListTable tbody');
        tbody.innerHTML = list.length === 0 ?
          '<tr><td colspan="4" style="text-align:center;color:#999;padding:40px;">该小区暂无楼栋</td></tr>' :
          list.map(b => `
            <tr>
              <td>${b.building_no}</td>
              <td>${b.unit_count || 0}</td>
              <td>${b.floor_count || 0}</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="showRooms(${b.id})">管理房间</button>
              </td>
            </tr>
          `).join('');
        
        document.getElementById('statBuildings').textContent = list.reduce((sum, b) => sum + 1, 0);
      } catch (err) {
        console.error('Load buildings error:', err);
      }
    }
    
    // 审核抵扣
    async function auditDeduction(id, status) {
      try {
        const res = await fetch(`${API_BASE}/deductions/${id}/audit`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status })
        });
        const result = await res.json();
        if (res.ok) {
          alert('审核成功');
          loadPendingDeductions();
        } else {
          alert(result.error);
        }
      } catch (err) {
        alert('操作失败');
      }
    }
    
    // 退出登录
    function logout() {
      if (confirm('确定要退出登录吗？')) {
        localStorage.removeItem('propertyToken');
        localStorage.removeItem('propertyInfo');
        window.location.href = '/';
      }
    }
    
    // 创建小区
    document.getElementById('createCommunityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      
      try {
        const res = await fetch(`${API_BASE}/communities`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          alert('小区创建成功');
          form.reset();
          loadCommunities();
        } else {
          alert(result.error);
        }
      } catch (err) {
        alert('创建失败');
      }
    });
    
    // 创建楼栋
    document.getElementById('createBuildingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      const communityId = document.getElementById('buildingCommunitySelect').value;
      
      if (!communityId) {
        alert('请先选择小区');
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/communities/${communityId}/buildings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          alert('楼栋创建成功');
          form.reset();
          loadBuildings();
        } else {
          alert(result.error);
        }
      } catch (err) {
        alert('创建失败');
      }
    });
  </script>
</body>
</html>
