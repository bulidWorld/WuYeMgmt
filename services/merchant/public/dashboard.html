<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; background: #f5f9ff; }
    
    .header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(79, 172, 254, 0.2);
    }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header-right { display: flex; gap: 16px; align-items: center; }
    .user-info { font-size: 14px; opacity: 0.95; }
    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .logout-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .main { display: flex; min-height: calc(100vh - 60px); }
    
    .sidebar {
      width: 200px;
      background: white;
      border-right: 1px solid #e3f2fd;
      padding: 20px 0;
      box-shadow: 2px 0 8px rgba(0,0,0,0.03);
    }
    .menu-item {
      padding: 14px 24px;
      cursor: pointer;
      color: #546e7a;
      transition: all 0.2s;
      font-size: 14px;
      border-left: 3px solid transparent;
    }
    .menu-item:hover { 
      background: #e3f2fd;
      color: #1976d2;
    }
    .menu-item.active {
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      color: #1565c0;
      border-left-color: #4facfe;
      font-weight: 600;
    }
    
    .content { flex: 1; padding: 24px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(79, 172, 254, 0.08);
      border: 1px solid #e3f2fd;
    }
    .card-title { 
      font-size: 18px; 
      font-weight: 600; 
      margin-bottom: 20px; 
      color: #1565c0;
      padding-bottom: 12px;
      border-bottom: 2px solid #e3f2fd;
    }
    
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(79, 172, 254, 0.08);
      border: 1px solid #e3f2fd;
      transition: transform 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(79, 172, 254, 0.15);
    }
    .stat-value { 
      font-size: 32px; 
      font-weight: 700; 
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .stat-label { font-size: 14px; color: #78909c; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e3f2fd; }
    th { 
      font-weight: 600; 
      color: #546e7a; 
      font-size: 14px; 
      background: #f5f9ff;
    }
    td { font-size: 14px; color: #37474f; }
    tr:hover { background: #f5f9ff; }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
    }
    .btn-primary:hover { 
      transform: translateY(-1px); 
      box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3); 
    }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 500; 
      color: #546e7a; 
      font-size: 14px; 
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e3f2fd;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
      background: #fafdff;
    }
    .form-group input:focus, .form-group select:focus { 
      outline: none; 
      border-color: #4facfe;
      background: white;
      box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
    }
    .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag-success { background: #e8f5e9; color: #2e7d32; }
    .tag-warning { background: #fff3e0; color: #f57c00; }
    .tag-lowcarbon { background: #e3f2fd; color: #1976d2; }
    
    .page { display: none; }
    .page.active { display: block; }
    
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #4facfe;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏪 商家管理后台</h1>
    <div class="header-right">
      <span class="user-info" id="userInfo">-</span>
      <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
  </div>
  
  <div class="main">
    <div class="sidebar">
      <div class="menu-item active" onclick="showPage('dashboard')">📊 概览</div>
      <div class="menu-item" onclick="showPage('products')">📦 商品管理</div>
      <div class="menu-item" onclick="showPage('orders')">📝 订单管理</div>
      <div class="menu-item" onclick="showPage('stats')">📈 数据统计</div>
    </div>
    
    <div class="content">
      <!-- 概览页 -->
      <div class="page active" id="dashboard">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-value" id="statProducts">0</div>
            <div class="stat-label">商品总数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statOrders">0</div>
            <div class="stat-label">订单总数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statRevenue">0</div>
            <div class="stat-label">销售总额</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statToday">0</div>
            <div class="stat-label">今日订单</div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">📋 店铺信息</div>
          <div id="shopInfo">加载中...</div>
        </div>
      </div>
      
      <!-- 商品管理页 -->
      <div class="page" id="products">
        <div class="card">
          <div class="card-title">🆕 上架商品</div>
          <form id="createProductForm">
            <div class="form-row">
              <div class="form-group">
                <label>商品名称 *</label>
                <input type="text" name="name" required placeholder="请输入商品名称">
              </div>
              <div class="form-group">
                <label>商品分类 *</label>
                <select name="category_id" required id="categorySelect">
                  <option value="">请选择分类</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>商品价格 *</label>
                <input type="number" name="price" required step="0.01" placeholder="0.00">
              </div>
              <div class="form-group">
                <label>库存数量 *</label>
                <input type="number" name="stock" required placeholder="0">
              </div>
            </div>
            <div class="form-group">
              <label>商品描述</label>
              <input type="text" name="description" placeholder="商品描述（可选）">
            </div>
            <div class="form-group">
              <label>
                <input type="checkbox" name="is_low_carbon" value="1"> 
                <span style="color: #1976d2; font-weight: 500;">🌱 低碳商品</span>
                <span style="color: #78909c; font-size: 13px;">（额外 50% 积分奖励）</span>
              </label>
            </div>
            <button type="submit" class="btn btn-primary">✨ 上架商品</button>
          </form>
        </div>
        
        <div class="card">
          <div class="card-title">📦 商品列表</div>
          <table id="productListTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>商品名称</th>
                <th>分类</th>
                <th>价格</th>
                <th>库存</th>
                <th>积分倍率</th>
                <th>销量</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- 订单管理页 -->
      <div class="page" id="orders">
        <div class="card">
          <div class="card-title">📝 订单列表</div>
          <table id="orderListTable">
            <thead>
              <tr>
                <th>订单号</th>
                <th>用户</th>
                <th>金额</th>
                <th>积分</th>
                <th>状态</th>
                <th>时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- 数据统计页 -->
      <div class="page" id="stats">
        <div class="card">
          <div class="card-title">📈 销售统计</div>
          <div id="statsContent">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑商品模态框 -->
  <div id="editModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:12px;padding:24px;width:90%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,0.2);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="color:#1565c0;margin:0;">✏️ 编辑商品</h3>
        <button onclick="closeEditModal()" style="background:none;border:none;font-size:24px;color:#90a4ae;cursor:pointer;">&times;</button>
      </div>
      
      <input type="hidden" id="editProductId">
      
      <div class="form-row">
        <div class="form-group">
          <label>商品名称 *</label>
          <input type="text" id="editProductName" required>
        </div>
        <div class="form-group">
          <label>商品分类 *</label>
          <select id="editProductCategory">
            <option value="">请选择分类</option>
          </select>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>商品价格 *</label>
          <input type="number" id="editProductPrice" step="0.01" required>
        </div>
        <div class="form-group">
          <label>库存数量 *</label>
          <input type="number" id="editProductStock" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>商品描述</label>
        <input type="text" id="editProductDesc" placeholder="商品描述（可选）">
      </div>
      
      <div class="form-group">
        <label>
          <input type="checkbox" id="editProductLowCarbon"> 
          <span style="color:#1976d2;font-weight:500;">🌱 低碳商品</span>
          <span style="color:#78909c;font-size:13px;">（额外 50% 积分奖励）</span>
        </label>
      </div>
      
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px;">
        <button onclick="closeEditModal()" class="btn" style="background:#f5f5f5;color:#546e7a;">取消</button>
        <button onclick="saveProductEdit()" class="btn btn-primary">💾 保存修改</button>
      </div>
    </div>
  </div>

  <script>
    var currentHost = window.location.host || 'localhost:3002';
    var API_BASE = window.location.protocol + '//' + currentHost + '/api';
    
    console.log('商家后台已加载');
    console.log('API 地址:', API_BASE);
    
    var token = localStorage.getItem('merchantToken');
    var merchantInfo = JSON.parse(localStorage.getItem('merchantInfo') || '{}');
    var categories = [];
    
    if (!token) {
      window.location.href = '/';
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('userInfo').textContent = merchantInfo.name || '-';
      loadData();
    });
    
    async function loadData() {
      await loadCategories();
      await loadShopInfo();
      await loadStats();
      await loadProducts();
      await loadOrders();
    }
    
    async function loadCategories() {
      try {
        const res = await fetch(API_BASE + '/categories');
        const result = await res.json();
        categories = result.list || [];
        
        console.log('加载分类:', categories.length, '个');
        
        var select = document.getElementById('categorySelect');
        select.innerHTML = '<option value="">请选择分类</option>' + 
          categories.map(function(c) {
            return '<option value="' + c.id + '">' + c.name + ' (' + c.points_rate + '倍积分)</option>';
          }).join('');
      } catch (err) {
        console.error('Load categories error:', err);
        categories = [
          {id:1, name:'粮油调味', points_rate:1.5},
          {id:2, name:'洗漱护理', points_rate:1.2},
          {id:3, name:'家居日用', points_rate:1.2},
          {id:4, name:'生鲜果蔬', points_rate:1.5},
          {id:5, name:'休闲食品', points_rate:1.0},
          {id:6, name:'酒水饮料', points_rate:1.0},
          {id:21, name:'新鲜蔬菜', points_rate:1.5},
          {id:22, name:'新鲜水果', points_rate:1.5}
        ];
        var select = document.getElementById('categorySelect');
        select.innerHTML = '<option value="">请选择分类</option>' + 
          categories.map(function(c) {
            return '<option value="' + c.id + '">' + c.name + ' (' + c.points_rate + '倍积分)</option>';
          }).join('');
      }
    }
    
    async function loadShopInfo() {
      try {
        const res = await fetch(API_BASE + '/info', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        var m = result.merchant || {};
        document.getElementById('shopInfo').innerHTML = 
          '<p style="margin-bottom:8px;"><strong style="color:#1565c0;">店铺名称：</strong>' + (m.name || '-') + '</p>' +
          '<p style="margin-bottom:8px;"><strong style="color:#1565c0;">联系人：</strong>' + (m.contact_name || '-') + '</p>' +
          '<p style="margin-bottom:8px;"><strong style="color:#1565c0;">联系电话：</strong>' + (m.contact_phone || '-') + '</p>' +
          '<p style="margin-bottom:8px;"><strong style="color:#1565c0;">店铺地址：</strong>' + (m.address || '-') + '</p>' +
          '<p><strong style="color:#1565c0;">审核状态：</strong>' + (m.audit_status == 1 ? '<span class="tag tag-success">✓ 已通过</span>' : '<span class="tag tag-warning">⏳ 审核中</span>') + '</p>';
      } catch (err) {
        console.error('Load shop info error:', err);
      }
    }
    
    async function loadStats() {
      try {
        const res = await fetch(API_BASE + '/stats', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        var s = result.stats || {};
        document.getElementById('statProducts').textContent = s.active_products || 0;
        document.getElementById('statOrders').textContent = s.total_orders || 0;
        document.getElementById('statRevenue').textContent = '¥' + (s.total_revenue || 0).toFixed(2);
        document.getElementById('statToday').textContent = s.today_orders || 0;
      } catch (err) {
        console.error('Load stats error:', err);
      }
    }
    
    async function loadProducts() {
      try {
        console.log('开始加载商品列表...');
        const res = await fetch(API_BASE + '/products', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        var list = result.list || [];
        
        console.log('商品列表:', list.length, '个商品');
        console.log('分类列表:', categories.length, '个分类');
        
        var tbody = document.querySelector('#productListTable tbody');
        if (!tbody) {
          console.error('商品列表 tbody 未找到');
          return;
        }
        
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#90a4ae;padding:40px;">暂无商品，请上架商品</td></tr>';
          document.getElementById('statProducts').textContent = '0';
          return;
        }
        
        var html = '';
        for (var i = 0; i < list.length; i++) {
          var p = list[i];
          console.log('渲染商品:', p.id, p.name, '分类 ID:', p.category_id);
          var cat = null;
          for (var j = 0; j < categories.length; j++) {
            if (categories[j].id == p.category_id) {
              cat = categories[j];
              break;
            }
          }
          cat = cat || {};
          html += '<tr>' +
            '<td>' + p.id + '</td>' +
            '<td>' + p.name + (p.is_low_carbon ? ' <span class="tag tag-lowcarbon">🌱 低碳</span>' : '') + '</td>' +
            '<td>' + (cat.name || '分类' + p.category_id) + '</td>' +
            '<td style="color:#1976d2;font-weight:500;">¥' + parseFloat(p.price).toFixed(2) + '</td>' +
            '<td>' + p.stock + '</td>' +
            '<td><span class="tag tag-lowcarbon">' + (p.points_rate || 1.0) + '倍</span></td>' +
            '<td>' + (p.sales_count || 0) + '</td>' +
            '<td><button class="btn btn-sm btn-primary" onclick="editProduct(' + p.id + ')">编辑</button></td>' +
            '</tr>';
        }
        tbody.innerHTML = html;
        document.getElementById('statProducts').textContent = list.length;
        
        // 保存商品列表到全局变量，供编辑使用
        window.productList = list;
        
        console.log('商品列表渲染完成');
      } catch (err) {
        console.error('Load products error:', err);
      }
    }
    
    async function loadOrders() {
      try {
        const res = await fetch(API_BASE + '/orders', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        var list = result.list || [];
        
        var tbody = document.querySelector('#orderListTable tbody');
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#90a4ae;padding:40px;">暂无订单</td></tr>';
          return;
        }
        
        var statusMap = {0:'待付款',1:'已付款',2:'已发货',3:'已核销',4:'已完成',5:'已取消'};
        
        tbody.innerHTML = list.map(function(o) {
          return '<tr>' +
            '<td style="font-family:monospace;">' + o.order_no + '</td>' +
            '<td>' + (o.nickname || o.user_id) + '</td>' +
            '<td style="color:#1976d2;font-weight:500;">¥' + (o.actual_amount || 0).toFixed(2) + '</td>' +
            '<td>' + (o.points_earned || 0) + '</td>' +
            '<td><span class="tag tag-success">' + (statusMap[o.status] || '未知') + '</span></td>' +
            '<td>' + new Date(o.created_at).toLocaleString() + '</td>' +
            '<td><button class="btn btn-sm btn-primary" onclick="viewOrder(' + o.id + ')">查看</button></td>' +
            '</tr>';
        }).join('');
        
        document.getElementById('statOrders').textContent = list.length;
      } catch (err) {
        console.error('Load orders error:', err);
      }
    }
    
    function showPage(page) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.querySelectorAll('.menu-item').forEach(function(m) { m.classList.remove('active'); });
      document.getElementById(page).classList.add('active');
      event.target.classList.add('active');
    }
    
    function logout() {
      if (confirm('确定要退出登录吗？')) {
        localStorage.removeItem('merchantToken');
        localStorage.removeItem('merchantInfo');
        window.location.href = '/';
      }
    }
    
    document.getElementById('createProductForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var form = e.target;
      var data = {
        name: form.name.value,
        category_id: parseInt(form.category_id.value),
        price: parseFloat(form.price.value),
        stock: parseInt(form.stock.value),
        description: form.description.value || null,
        is_low_carbon: form.is_low_carbon.checked
      };
      
      try {
        const res = await fetch(API_BASE + '/products', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          alert('✓ 商品上架成功！\n积分倍率：' + (result.points_rate || 1.0) + '倍');
          form.reset();
          loadProducts();
          loadStats();
        } else {
          alert('✗ ' + (result.error || '上架失败'));
        }
      } catch (err) {
        alert('✗ 上架失败：' + err.message);
      }
    });
    
    function editProduct(id) {
      // 获取商品数据
      var product = null;
      for (var i = 0; i < (window.productList || []).length; i++) {
        if (window.productList[i].id == id) {
          product = window.productList[i];
          break;
        }
      }
      if (!product) {
        alert('商品数据未找到');
        return;
      }
      
      // 填充分类选择器
      var categorySelect = document.getElementById('editProductCategory');
      categorySelect.innerHTML = '<option value="">请选择分类</option>' + 
        categories.map(function(c) {
          return '<option value="' + c.id + '">' + c.name + ' (' + c.points_rate + '倍积分)</option>';
        }).join('');
      
      // 填充表单数据
      document.getElementById('editProductId').value = product.id;
      document.getElementById('editProductName').value = product.name;
      document.getElementById('editProductCategory').value = product.category_id;
      document.getElementById('editProductPrice').value = product.price;
      document.getElementById('editProductStock').value = product.stock;
      document.getElementById('editProductDesc').value = product.description || '';
      document.getElementById('editProductLowCarbon').checked = product.is_low_carbon == 1;
      
      document.getElementById('editModal').style.display = 'block';
    }
    
    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }
    
    function saveProductEdit() {
      var id = document.getElementById('editProductId').value;
      var data = {
        name: document.getElementById('editProductName').value,
        category_id: parseInt(document.getElementById('editProductCategory').value),
        price: parseFloat(document.getElementById('editProductPrice').value),
        stock: parseInt(document.getElementById('editProductStock').value),
        description: document.getElementById('editProductDesc').value || null,
        is_low_carbon: document.getElementById('editProductLowCarbon').checked
      };
      
      fetch(API_BASE + '/products/' + id, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.message) {
          alert('✓ 商品已更新！\n积分倍率：' + (result.points_rate || 1.0) + '倍');
          closeEditModal();
          loadProducts();
          loadStats();
        } else {
          alert('✗ ' + (result.error || '更新失败'));
        }
      })
      .catch(function(err) {
        alert('✗ 更新失败：' + err.message);
      });
    }
    
    function deleteProduct(id) {
      if (!confirm('确定要下架该商品吗？')) {
        return;
      }
      
      fetch(API_BASE + '/products/' + id, {
        method: 'DELETE',
        headers: {
          'Authorization': 'Bearer ' + token
        }
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.message) {
          alert('✓ ' + result.message);
          loadProducts();
          loadStats();
        } else {
          alert('✗ ' + (result.error || '操作失败'));
        }
      })
      .catch(function(err) {
        alert('✗ 操作失败：' + err.message);
      });
    }
    
    function viewOrder(id) {
      alert('查看订单功能开发中，订单 ID: ' + id);
    }
  </script>
</body>
</html>
