<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台管理后台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
      border: 2px solid #d4af37;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(212, 175, 55, 0.2);
      overflow: hidden;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) { .container { flex-direction: row; } }
    .left {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      padding: 40px; color: #1a1a1a; flex: 1;
      display: flex; flex-direction: column; justify-content: center;
    }
    .left h1 { font-size: 24px; margin-bottom: 16px; font-weight: 700; }
    .left p { opacity: 0.9; line-height: 1.6; font-size: 14px; }
    .right { padding: 40px; flex: 1; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #d4af37; }
    .form-group input {
      width: 100%; padding: 12px 16px;
      background: #2d2d2d; border: 2px solid #444;
      color: #f5f5f5; border-radius: 8px;
      font-size: 16px; transition: border-color 0.3s;
    }
    .form-group input:focus { 
      outline: none; 
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #1a1a1a;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .message {
      padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none;
    }
    .message.error { background: rgba(244, 67, 54, 0.2); border: 1px solid #f44336; color: #f44336; display: block; }
    .message.success { background: rgba(76, 175, 80, 0.2); border: 1px solid #4caf50; color: #4caf50; display: block; }
    .hint { font-size: 12px; color: #888; margin-top: 8px; }
    .service-links {
      margin-top: 24px; padding-top: 24px; border-top: 1px solid #333;
    }
    .service-links h3 { font-size: 13px; color: #888; margin-bottom: 12px; }
    .service-links a {
      display: block; padding: 8px 12px; background: #2d2d2d;
      border: 1px solid #444; border-radius: 6px; color: #aaa;
      text-decoration: none; font-size: 13px; margin-bottom: 8px;
      transition: all 0.2s;
    }
    .service-links a:hover { 
      background: #333; 
      border-color: #d4af37;
      color: #d4af37;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h1>⚙️ 平台管理后台</h1>
      <p>社区便民低碳超市 - 管理员登录</p>
      <p style="margin-top: 16px; font-size: 13px; opacity: 0.9;">
        登录后可管理用户、商家、物业、小区、订单和商品分类
      </p>
    </div>
    
    <div class="right">
      <div id="message" class="message"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" required minlength="6">
          <p class="hint">初始密码为 123456</p>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">登录</button>
      </form>
      
      <div class="service-links">
        <h3>其他服务入口：</h3>
        <a href="http://localhost:3000/" target="_blank">🌿 用户登录 (端口 3000)</a>
        <a href="http://localhost:3002/" target="_blank">🏪 商家服务 (端口 3002)</a>
        <a href="http://localhost:3003/" target="_blank">🏠 物业服务 (端口 3003)</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol + '//' + window.location.host + '/api';
    
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '登录中...';
      
      const message = document.getElementById('message');
      message.style.display = 'none';
      
      try {
        const res = await fetch(API_BASE + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const result = await res.json();
        
        if (result.token) {
          message.textContent = '登录成功！正在跳转...';
          message.className = 'message success';
          message.style.display = 'block';
          
          localStorage.setItem('adminToken', result.token);
          localStorage.setItem('adminInfo', JSON.stringify(result.admin));
          
          setTimeout(function() {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          message.textContent = result.error || '登录失败';
          message.className = 'message error';
          message.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = '登录';
        }
      } catch (err) {
        message.textContent = '网络错误：' + err.message;
        message.className = 'message error';
        message.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
