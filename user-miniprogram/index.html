<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>社区便民低碳超市</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.5;
      padding-bottom: 60px;
    }
    
    /* 顶部导航 */
    .header {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header-icon { font-size: 22px; cursor: pointer; }
    
    /* 搜索栏 */
    .search-bar {
      background: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-input {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f5f5f5;
      border-radius: 20px;
      padding: 8px 14px;
      gap: 8px;
    }
    .search-input input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
    }
    .scan-btn {
      font-size: 22px;
      color: #11998e;
    }
    
    /* 分类标签 */
    .categories {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .category {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 56px;
      cursor: pointer;
    }
    .category-icon {
      width: 48px;
      height: 48px;
      background: #f0f9f4;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .category-name { font-size: 12px; color: #666; }
    
    /* Banner */
    .banner {
      margin: 12px 16px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: white;
    }
    .banner h2 { font-size: 18px; margin-bottom: 8px; }
    .banner p { font-size: 13px; opacity: 0.9; }
    
    /* 商品列表 */
    .section-title {
      padding: 16px 16px 8px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px 16px;
    }
    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .product-img {
      width: 100%;
      aspect-ratio: 1;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .product-info { padding: 10px; }
    .product-name {
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 6px;
    }
    .product-tags {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e8f5e9;
      color: #2e7d32;
    }
    .tag.low-carbon {
      background: #e3f2fd;
      color: #1976d2;
    }
    .product-price {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .price {
      font-size: 18px;
      font-weight: 700;
      color: #e53935;
    }
    .price::before { content: '¥'; font-size: 12px; }
    .original-price {
      font-size: 12px;
      color: #999;
      text-decoration: line-through;
    }
    .product-sales {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    
    /* 底部导航 */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      display: flex;
      border-top: 1px solid #eee;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #999;
      font-size: 11px;
      cursor: pointer;
    }
    .tab-item.active { color: #11998e; }
    .tab-icon { font-size: 22px; }
    .tab-badge {
      position: absolute;
      top: 8px;
      right: 25%;
      background: #e53935;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
    }
    
    /* 页面容器 */
    .page { display: none; }
    .page.active { display: block; }
    
    /* 登录页面 */
    .login-page {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .login-page.active { display: flex; }
    .login-header {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      padding: 60px 20px 40px;
      text-align: center;
    }
    .login-header h1 { font-size: 24px; margin-bottom: 8px; }
    .login-header p { opacity: 0.9; }
    .login-form {
      padding: 24px 20px;
      flex: 1;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }
    .form-input:focus { border-color: #11998e; }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:disabled { opacity: 0.6; }
    
    /* 消息提示 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 2000;
      display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <!-- 登录页面 -->
  <div class="login-page" id="loginPage">
    <div class="login-header">
      <h1>🌿 用户登录</h1>
      <p>社区便民低碳超市 - 移动端</p>
    </div>
    <div class="login-form">
      <input type="tel" class="form-input" id="loginPhone" placeholder="请输入手机号" maxlength="11">
      <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" minlength="6">
      <button class="login-btn" id="loginBtn">登录</button>
      <p style="text-align: center; margin-top: 20px; color: #666; font-size: 14px;">
        还没有账号？<a href="#" id="registerLink" style="color: #11998e;">立即注册</a>
      </p>
    </div>
  </div>
  
  <!-- 首页 -->
  <div class="page active" id="homePage">
    <div class="header">
      <h1>🌿 低碳超市</h1>
      <span class="header-icon" onclick="showMessage('消息功能开发中')">🔔</span>
    </div>
    
    <div class="search-bar">
      <div class="search-input">
        <span>🔍</span>
        <input type="text" placeholder="搜索商品" id="searchInput">
      </div>
      <span class="scan-btn">📷</span>
    </div>
    
    <div class="categories">
      <div class="category" onclick="filterCategory(0)">
        <div class="category-icon">🏠</div>
        <span class="category-name">全部</span>
      </div>
      <div class="category" onclick="filterCategory(1)">
        <div class="category-icon">🌾</div>
        <span class="category-name">粮油</span>
      </div>
      <div class="category" onclick="filterCategory(2)">
        <div class="category-icon">🧴</div>
        <span class="category-name">洗漱</span>
      </div>
      <div class="category" onclick="filterCategory(3)">
        <div class="category-icon">🏠</div>
        <span class="category-name">家居</span>
      </div>
      <div class="category" onclick="filterCategory(4)">
        <div class="category-icon">🥬</div>
        <span class="category-name">生鲜</span>
      </div>
      <div class="category" onclick="filterCategory(5)">
        <div class="category-icon">🍪</div>
        <span class="category-name">食品</span>
      </div>
    </div>
    
    <div class="banner">
      <h2>🌱 低碳生活 从我做起</h2>
      <p>购买低碳商品获得额外积分，积分可抵扣物业费</p>
    </div>
    
    <div class="section-title">
      <span>🔥</span> 热门推荐
    </div>
    
    <div class="products" id="productList">
      <!-- 商品由 JS 动态加载 -->
    </div>
  </div>
  
  <!-- 分类页 -->
  <div class="page" id="categoryPage">
    <div class="header">
      <h1>分类</h1>
    </div>
    <div style="padding: 20px; text-align: center; color: #999;">
      分类功能开发中...
    </div>
  </div>
  
  <!-- 购物车页 -->
  <div class="page" id="cartPage">
    <div class="header">
      <h1>购物车</h1>
    </div>
    <div style="padding: 20px; text-align: center; color: #999;">
      购物车是空的
    </div>
  </div>
  
  <!-- 我的页 -->
  <div class="page" id="minePage">
    <div class="header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
      <h1>我的</h1>
      <span class="header-icon" onclick="logout()">⚙️</span>
    </div>
    
    <div style="background: white; margin: 12px 16px; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px;">👤</div>
      <div>
        <div style="font-size: 18px; font-weight: 600;" id="userName">用户</div>
        <div style="font-size: 13px; color: #999; margin-top: 4px;" id="userPhone">-</div>
      </div>
    </div>
    
    <div style="background: white; margin: 12px 16px; border-radius: 12px; overflow: hidden;">
      <div style="display: flex; padding: 20px; border-bottom: 1px solid #f0f0f0;">
        <div style="flex: 1; text-align: center;">
          <div style="font-size: 24px; font-weight: 700; color: #11998e;" id="userPoints">0</div>
          <div style="font-size: 12px; color: #999; margin-top: 4px;">低碳积分</div>
        </div>
        <div style="flex: 1; text-align: center; border-left: 1px solid #f0f0f0;">
          <div style="font-size: 24px; font-weight: 700; color: #667eea;" id="userLevel">普通</div>
          <div style="font-size: 12px; color: #999; margin-top: 4px;">会员等级</div>
        </div>
        <div style="flex: 1; text-align: center; border-left: 1px solid #f0f0f0;">
          <div style="font-size: 24px; font-weight: 700; color: #e53935;" id="userOrders">0</div>
          <div style="font-size: 12px; color: #999; margin-top: 4px;">订单数</div>
        </div>
      </div>
    </div>
    
    <div style="background: white; margin: 12px 16px; border-radius: 12px; overflow: hidden;">
      <div style="padding: 16px; border-bottom: 1px solid #f0f0f0;" onclick="showMessage('订单功能开发中')">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 20px;">📦</span>
          <span style="flex: 1;">我的订单</span>
          <span style="color: #999;">›</span>
        </div>
      </div>
      <div style="padding: 16px; border-bottom: 1px solid #f0f0f0;" onclick="showMessage('积分功能开发中')">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 20px;">🎁</span>
          <span style="flex: 1;">积分明细</span>
          <span style="color: #999;">›</span>
        </div>
      </div>
      <div style="padding: 16px; border-bottom: 1px solid #f0f0f0;" onclick="showMessage('物业费抵扣功能开发中')">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 20px;">🏠</span>
          <span style="flex: 1;">物业费抵扣</span>
          <span style="color: #999;">›</span>
        </div>
      </div>
      <div style="padding: 16px;" onclick="showMessage('会员中心功能开发中')">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 20px;">👑</span>
          <span style="flex: 1;">会员中心</span>
          <span style="color: #999;">›</span>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 底部导航 -->
  <div class="tab-bar">
    <div class="tab-item active" data-page="home" onclick="switchPage('home')">
      <span class="tab-icon">🏠</span>
      <span>首页</span>
    </div>
    <div class="tab-item" data-page="category" onclick="switchPage('category')">
      <span class="tab-icon">📂</span>
      <span>分类</span>
    </div>
    <div class="tab-item" data-page="cart" onclick="switchPage('cart')">
      <span class="tab-icon">🛒</span>
      <span>购物车</span>
      <span class="tab-badge" id="cartBadge" style="display: none;">0</span>
    </div>
    <div class="tab-item" data-page="mine" onclick="switchPage('mine')">
      <span class="tab-icon">👤</span>
      <span>我的</span>
    </div>
  </div>
  
  <!-- 消息提示 -->
  <div class="toast" id="toast"></div>
  
  <script>
    // 自动使用当前主机地址，支持局域网访问
    const currentHost = window.location.host || 'localhost:3000';
    const API_BASE = window.location.protocol + '//' + currentHost + '/api';
    let currentUser = null;
    let products = [];
    let categories = []; // 分类列表缓存
    
    // 小区列表缓存
    let communities = [];
    
    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      checkLogin();
      loadCategories(); // 加载分类
      loadProducts();
      loadCommunities();
      
      document.getElementById('loginBtn').addEventListener('click', doLogin);
      document.getElementById('registerLink').addEventListener('click', (e) => {
        e.preventDefault();
        showRegister();
      });
      
      document.getElementById('searchInput').addEventListener('input', (e) => {
        renderProducts(products.filter(p => p.name.includes(e.target.value)));
      });
    });
    
    // 检查登录状态
    function checkLogin() {
      const token = localStorage.getItem('userToken');
      const userStr = localStorage.getItem('userInfo');
      
      if (token && userStr) {
        currentUser = JSON.parse(userStr);
        currentUser.token = token;
        updateUserInfo();
      } else {
        document.getElementById('loginPage').classList.add('active');
      }
    }
    
    // 登录
    async function doLogin() {
      const phone = document.getElementById('loginPhone').value;
      const password = document.getElementById('loginPassword').value;
      
      if (!phone || !password) {
        showMessage('请输入手机号和密码');
        return;
      }
      
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '登录中...';
      
      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        
        const result = await res.json();
        
        if (res.ok) {
          localStorage.setItem('userToken', result.token);
          localStorage.setItem('userInfo', JSON.stringify(result.user));
          currentUser = { ...result.user, token: result.token };
          updateUserInfo();
          document.getElementById('loginPage').classList.remove('active');
          showMessage('登录成功');
        } else {
          showMessage(result.error || '登录失败');
        }
      } catch (err) {
        showMessage('网络错误，请稍后重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    }
    
    // 登出
    function logout() {
      if (confirm('确定要退出登录吗？')) {
        localStorage.removeItem('userToken');
        localStorage.removeItem('userInfo');
        location.reload();
      }
    }
    
    // 更新用户信息
    function updateUserInfo() {
      if (currentUser) {
        document.getElementById('userName').textContent = currentUser.nickname || currentUser.phone;
        document.getElementById('userPhone').textContent = currentUser.phone;
        document.getElementById('userPoints').textContent = currentUser.available_points || 0;
        document.getElementById('userLevel').textContent = currentUser.is_member ? '会员' : '普通';
      }
    }
    
    // 加载商品
    async function loadProducts() {
      console.log('=== 开始加载商品列表 ===');
      console.log('API_BASE:', API_BASE);
      console.log('currentUser:', currentUser);
      console.log('token:', currentUser?.token ? '有 token' : '无 token');
      
      try {
        const res = await fetch(`${API_BASE}/products`, {
          headers: { 'Authorization': `Bearer ${currentUser?.token || ''}` }
        });
        
        console.log('API 响应状态:', res.status, res.ok ? '成功' : '失败');
        
        if (res.ok) {
          const result = await res.json();
          console.log('API 返回数据:', result);
          products = result.list || [];
          console.log('商品数量:', products.length);
          if (products.length > 0) {
            console.log('第一个商品:', products[0]);
          }
          // 根据当前选择的分类渲染
          if (currentCategoryId === 0) {
            renderProducts(products);
          } else {
            const filtered = products.filter(p => p.category_id == currentCategoryId);
            renderProducts(filtered);
          }
          console.log('✓ 商品列表已更新');
        } else {
          console.log('⚠️ API 请求失败，使用空列表');
          products = [];
          renderProducts([]);
        }
      } catch (err) {
        console.error('❌ 加载商品异常:', err);
        products = [];
        renderProducts([]);
      }
    }
    
    // 渲染商品
    function renderProducts(list) {
      const container = document.getElementById('productList');
      if (!container) return;
      
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">暂无商品</div>';
        return;
      }
      
      container.innerHTML = list.map(p => {
        const price = parseFloat(p.price) || 0;
        const originalPrice = p.original_price ? parseFloat(p.original_price) : null;
        const pointsRate = parseFloat(p.points_rate) || 1.0;
        // 计算积分：价格 × 分类倍率 × 低碳奖励
        const basePoints = Math.floor(price * pointsRate);
        const points = p.is_low_carbon ? Math.floor(basePoints * 1.5) : basePoints;
        
        return `
        <div class="product" onclick="showMessage('商品详情开发中')">
          <div class="product-img">📦</div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-tags">
              ${p.is_low_carbon ? '<span class="tag low-carbon">🌱 低碳</span>' : ''}
              <span class="tag">包邮</span>
            </div>
            <div class="product-price">
              <span class="price">¥${price.toFixed(2)}</span>
              ${originalPrice ? `<span class="original-price">¥${originalPrice.toFixed(2)}</span>` : ''}
            </div>
            <div class="product-points" style="color:#ff9800;font-size:13px;margin-top:6px;font-weight:500;">
              🎁 购买获得 ${points} 积分
              ${p.is_low_carbon ? '<span style="color:#4caf50;font-size:12px;">(含低碳奖励)</span>' : ''}
            </div>
            <div class="product-sales">已售 ${p.sales_count || 0}件</div>
          </div>
        </div>
        `;
      }).join('');
    }
    
    // 切换页面
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      
      document.getElementById(page + 'Page').classList.add('active');
      document.querySelector(`.tab-item[data-page="${page}"]`).classList.add('active');
    }
    
    // 消息提示
    function showMessage(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // 分类筛选
    let currentCategoryId = 0; // 0 表示全部
    
    function filterCategory(categoryId) {
      console.log('筛选分类:', categoryId);
      currentCategoryId = categoryId;
      
      // 更新分类高亮
      document.querySelectorAll('.category').forEach((el, index) => {
        if ((index === 0 && categoryId === 0) || 
            (index > 0 && categories[index-1] && categories[index-1].id === categoryId)) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
      
      // 筛选商品
      if (categoryId === 0) {
        // 显示全部
        renderProducts(products);
      } else {
        // 显示指定分类
        const filtered = products.filter(p => p.category_id == categoryId);
        renderProducts(filtered);
      }
    }
    
    // 加载分类列表
    async function loadCategories() {
      try {
        const res = await fetch(`${API_BASE}/categories`);
        const result = await res.json();
        categories = result.list || [];
        console.log('加载分类:', categories.length, '个');
        renderCategories();
      } catch (err) {
        console.error('加载分类失败:', err);
        // 使用默认分类
        categories = [
          { id: 0, name: '全部', icon: '🏠' },
          { id: 1, name: '粮油调味', icon: '🌾' },
          { id: 2, name: '洗漱护理', icon: '🧴' },
          { id: 3, name: '家居日用', icon: '🏠' },
          { id: 4, name: '生鲜果蔬', icon: '🥬' },
          { id: 5, name: '休闲食品', icon: '🍪' }
        ];
        renderCategories();
      }
    }
    
    // 渲染分类
    function renderCategories() {
      const container = document.querySelector('.categories');
      if (!container) return;
      
      // 图标映射
      const iconMap = {
        '粮油调味': '🌾', '洗漱护理': '🧴', '家居日用': '🏠',
        '生鲜果蔬': '🥬', '休闲食品': '🍪', '酒水饮料': '🍷',
        '白酒': '🍶', '啤酒': '🍺', '新鲜蔬菜': '🥬', '新鲜水果': '🍎'
      };
      
      let html = '<div class="category active" onclick="filterCategory(0)">' +
        '<div class="category-icon">🏠</div>' +
        '<span class="category-name">全部</span>' +
        '</div>';
      
      for (let i = 0; i < categories.length; i++) {
        const cat = categories[i];
        const icon = iconMap[cat.name] || '📦';
        html += '<div class="category" onclick="filterCategory(' + cat.id + ')">' +
          '<div class="category-icon">' + icon + '</div>' +
          '<span class="category-name">' + cat.name + '</span>' +
          '</div>';
      }
      
      container.innerHTML = html;
    }
    
    // 加载小区列表
    async function loadCommunities() {
      try {
        const res = await fetch(`${API_BASE}/communities`);
        const result = await res.json();
        communities = result.list || [];
      } catch (err) {
        console.error('Load communities error:', err);
      }
    }
    
    // 显示注册页面
    function showRegister() {
      const communityOptions = communities.map(c => 
        `<option value="${c.id}">${c.name}</option>`
      ).join('');
      
      const html = `
        <div class="login-page active" id="registerPage">
          <div class="login-header">
            <h1>🌿 用户注册</h1>
            <p>社区便民低碳超市</p>
          </div>
          <div class="login-form">
            <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号" maxlength="11">
            <input type="password" class="form-input" id="regPassword" placeholder="请输入密码（至少 6 位）" minlength="6">
            <input type="text" class="form-input" id="regNickname" placeholder="昵称（可选）">
            <select class="form-input" id="regCommunity" style="background: white;">
              <option value="">请选择小区 *</option>
              ${communityOptions}
            </select>
            <input type="text" class="form-input" id="regBuilding" placeholder="楼栋号（如：1 栋）">
            <input type="text" class="form-input" id="regUnit" placeholder="单元号（如：1 单元）">
            <input type="text" class="form-input" id="regRoom" placeholder="房间号（如：101）">
            <button class="login-btn" id="regBtn">注册</button>
            <p style="text-align: center; margin-top: 20px; color: #666; font-size: 14px;">
              已有账号？<a href="#" onclick="closeRegister()" style="color: #11998e;">返回登录</a>
            </p>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', html);
      
      document.getElementById('regBtn').addEventListener('click', doRegister);
    }
    
    // 关闭注册页面
    function closeRegister() {
      document.getElementById('registerPage').remove();
    }
    
    // 执行注册
    async function doRegister() {
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPassword').value;
      const nickname = document.getElementById('regNickname').value;
      const community_id = document.getElementById('regCommunity').value;
      const building_no = document.getElementById('regBuilding').value;
      const unit_no = document.getElementById('regUnit').value;
      const room_no = document.getElementById('regRoom').value;
      
      if (!phone || !password) {
        showMessage('手机号和密码不能为空');
        return;
      }
      if (!community_id) {
        showMessage('请选择所在小区');
        return;
      }
      
      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = '注册中...';
      
      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone, password,
            nickname: nickname || null,
            community_id: parseInt(community_id),
            building_no: building_no || null,
            unit_no: unit_no || null,
            room_no: room_no || null
          })
        });
        
        const result = await res.json();
        
        if (res.ok) {
          showMessage('注册成功！正在跳转...');
          setTimeout(() => {
            closeRegister();
            document.getElementById('loginPhone').value = phone;
            document.getElementById('loginPassword').value = password;
          }, 1500);
        } else {
          showMessage(result.error);
          btn.disabled = false;
          btn.textContent = '注册';
        }
      } catch (err) {
        showMessage('网络错误，请稍后重试');
        btn.disabled = false;
        btn.textContent = '注册';
      }
    }
  </script>
</body>
</html>
